<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeSync - Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <aside class="sidebar-shoesync d-none d-lg-block">
<div class="d-flex align-items-center mb-4">
    <img src="../assets/img/logo/logo_solo.png" alt="ShoeSync" style="height: 45px; width: auto;">
    <span class="fs-4 fw-bold text-dark">ShoeSync</span>
</div>        <nav class="nav flex-column gap-1">
            <a class="nav-link text-secondary" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a>
            <a class="nav-link active bg-primary bg-opacity-10 text-primary rounded fw-bold" href="usuarios.html"><i class="bi bi-people me-2"></i>Usuarios</a>
            <a class="nav-link text-secondary" href="roles.html"><i class="bi bi-shield-lock me-2"></i>Roles</a>
            <a class="nav-link text-secondary" href="clientes.html"><i class="bi bi-building me-2"></i>Clientes</a>
            <a class="nav-link text-secondary" href="pedidos.html"><i class="bi bi-bag me-2"></i>Pedidos</a>
            <a class="nav-link text-secondary" href="reportes.html"><i class="bi bi-bar-chart me-2"></i>Reportes</a>
            <hr>
            <button onclick="logoutUser()" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i>Salir</button>
        </nav>
    </aside>

    <main class="main-wrapper">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div><h1 class="h3 fw-bold mb-0">Control de Usuarios</h1><small class="text-secondary">Administración General</small></div>
            <button class="btn btn-shoesync-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario"><i class="bi bi-person-plus me-1"></i> Crear Usuario</button>
        </header>

        <section class="card-shoesync p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>Miguel Porras</td><td>admin@shoesync.com</td><td><span class="badge bg-primary">Admin</span></td><td><span class="badge bg-success">Activo</span></td><td class="text-end"><button class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger"><i class="bi bi-slash-circle"></i></button></td></tr>
                        <tr><td>Carlos López</td><td>ventas@shoesync.com</td><td><span class="badge bg-info text-dark">Ventas</span></td><td><span class="badge bg-success">Activo</span></td><td class="text-end"><button class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger"><i class="bi bi-slash-circle"></i></button></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title fw-bold">Nuevo Usuario</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="formUsuario">
                        <div class="mb-3"><label class="form-label small fw-bold">Nombre Completo</label><input type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label small fw-bold">Correo Electrónico</label><input type="email" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label small fw-bold">Rol</label><select class="form-select"><option>Administrador</option><option>Ventas</option><option>Producción</option><option>Almacén</option></select></div>
                    </form>
                </div>
                <div class="modal-footer"><button class="btn btn-shoesync-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-shoesync-primary" onclick="alert('Usuario creado.'); bootstrap.Modal.getInstance(document.getElementById('modalUsuario')).hide();">Guardar</button></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
