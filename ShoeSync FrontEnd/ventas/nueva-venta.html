<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeSync - Registrar Nueva Venta</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Independientes -->
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <aside class="sidebar-shoesync d-none d-lg-block">
        <div class="d-flex align-items-center mb-4">
    <img src="../assets/img/logo/logo_solo.png" alt="ShoeSync" style="height: 45px; width: auto;">
    <span class="fs-4 fw-bold text-dark">ShoeSync</span>
</div>
        <nav class="nav flex-column gap-1">
            <a class="nav-link text-secondary" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a>
            <a class="nav-link text-secondary" href="clientes.html"><i class="bi bi-people me-2"></i>Clientes</a>
            <a class="nav-link text-secondary" href="pedidos.html"><i class="bi bi-bag me-2"></i>Pedidos</a>
            <a class="nav-link active bg-primary bg-opacity-10 text-primary rounded fw-bold" href="nueva-venta.html"><i class="bi bi-cash-stack me-2"></i>Nueva Venta</a>
            <a class="nav-link text-secondary" href="ventas.html"><i class="bi bi-receipt me-2"></i>Historial Ventas</a>
            <hr>
            <button onclick="logoutUser()" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i>Salir</button>
        </nav>
    </aside>

    <main class="main-wrapper" style="max-width: 800px;">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-0">Registrar Nueva Venta / Facturación</h1>
            <small class="text-secondary">Generar comprobante de transacción sobre pedido</small>
        </header>

        <div class="card-shoesync p-4">
            <form onsubmit="alert('Venta registrada con éxito.'); window.location.href='ventas.html'; return false;">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Cliente Comercial</label>
                        <select class="form-select" required>
                            <option value="">Selecciona un cliente...</option>
                            <option>Coppel S.A. de C.V.</option>
                            <option>Grupo Elektra</option>
                            <option>Liverpool</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Pedido Relacionado</label>
                        <select class="form-select" required>
                            <option value="">Selecciona un pedido...</option>
                            <option>PED-001 (Bota Industrial Pro - 2,000 pares)</option>
                            <option>PED-002 (Calzado Escolar - 1,000 pares)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Monto Total ($ MXN)</label>
                        <input type="number" class="form-control" placeholder="Ej. 400000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Método de Pago</label>
                        <select class="form-select" required>
                            <option>Transferencia Bancaria (SPEI)</option>
                            <option>Crédito Comercial (30 Días)</option>
                            <option>Cheque Certificado</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold">Observaciones / Folio Fiscal</label>
                        <textarea class="form-control" rows="2" placeholder="Notas de pago o facturación..."></textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-shoesync-primary w-100"><i class="bi bi-cash-check me-1"></i> Finalizar Registro de Venta</button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="../assets/js/auth.js"></script>
</body>
</html>
