<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>ShoeSync - Nuevo Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <aside class="sidebar-shoesync d-none d-lg-block">
<div class="d-flex align-items-center mb-4">
    <img src="../assets/img/logo/logo_solo.png" alt="ShoeSync" style="height: 45px; width: auto;">
    <span class="fs-4 fw-bold text-dark">ShoeSync</span>
</div>        <nav class="nav flex-column gap-1">
            <a class="nav-link text-secondary" href="dashboard.html"><i class="bi bi-grid me-2"></i>Dashboard</a>
            <a class="nav-link text-secondary" href="pedidos.html"><i class="bi bi-bag me-2"></i>Pedidos</a>
            <a class="nav-link active bg-primary bg-opacity-10 text-primary rounded fw-bold" href="pedido-nuevo.html"><i class="bi bi-plus-circle me-2"></i>Nuevo Pedido</a>
            <hr><button onclick="logoutUser()" class="btn btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-2"></i>Salir</button>
        </nav>
    </aside>
    <main class="main-wrapper" style="max-width: 800px;">
        <h1 class="h3 fw-bold mb-4">Registro de Nuevo Pedido</h1>
        <div class="card-shoesync p-4">
            <form onsubmit="alert('Pedido levantado e integrado a producción.'); window.location.href='pedidos.html'; return false;">
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label small fw-bold">Cliente Comercial</label><select class="form-select" required><option>Coppel</option><option>Elektra</option><option>Liverpool</option></select></div>
                    <div class="col-md-6"><label class="form-label small fw-bold">Modelo de Calzado</label><input type="text" class="form-control" placeholder="Ej. Bota Industrial Pro" required></div>
                    <div class="col-md-6"><label class="form-label small fw-bold">Cantidad de Pares</label><input type="number" class="form-control" min="1" required></div>
                    <div class="col-md-6"><label class="form-label small fw-bold">Fecha de Entrega Compromiso</label><input type="date" class="form-control" required></div>
                    <div class="col-12"><button type="submit" class="btn btn-shoesync-primary w-100"><i class="bi bi-check-circle me-1"></i> Confirmar Pedido</button></div>
                </div>
            </form>
        </div>
    </main>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
