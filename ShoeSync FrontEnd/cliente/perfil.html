<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeSync - Mi Perfil</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Independientes -->
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="bg-shoesync-secondary">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="inicio.html">
    <img src="../assets/img/logo/logo_solo.png" alt="ShoeSync" style="height: 38px; width: auto;">
    <span class="fs-4 fw-bold text-dark">ShoeSync</span>
</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCliente">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navCliente">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="inicio.html"><i class="bi bi-house me-1"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="pedidos.html"><i class="bi bi-bag me-1"></i> Mis Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link" href="seguimiento.html"><i class="bi bi-diagram-3 me-1"></i> Seguimiento</a></li>
                    <li class="nav-item"><a class="nav-link" href="qr.html"><i class="bi bi-qr-code me-1"></i> Código QR</a></li>
                    <li class="nav-item"><a class="nav-link" href="historial.html"><i class="bi bi-clock-history me-1"></i> Historial</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-primary" href="perfil.html"><i class="bi bi-person-circle me-1"></i> Mi Perfil</a></li>
                </ul>
                <button onclick="logoutUser()" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 700px;">
        <header class="mb-4">
            <h1 class="h3 fw-bold mb-0">Perfil de la Cuenta</h1>
            <small class="text-secondary">Información comercial y preferencias de usuario</small>
        </header>

        <div class="card-shoesync p-4 mb-4">
            <form onsubmit="alert('Información de perfil actualizada.'); return false;">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                        <i class="bi bi-building fs-1"></i>
                    </div>
                    <h5 class="fw-bold mb-0">Coppel S.A. de C.V.</h5>
                    <span class="badge bg-success mt-1">Cuenta Comercial Verificada</span>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Empresa / Razón Social</label>
                        <input type="text" class="form-control" value="Coppel S.A. de C.V.">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control" value="cliente@shoesync.com" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Contacto Principal</label>
                        <input type="text" class="form-control" value="Lic. Roberto Gómez">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Teléfono de Contacto</label>
                        <input type="text" class="form-control" value="+52 477 123 4567">
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-shoesync-primary w-100"><i class="bi bi-save me-1"></i> Guardar Cambios</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Preferencias Básicas -->
        <div class="card-shoesync p-4">
            <h6 class="fw-bold mb-3">Preferencias de Notificación</h6>
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" id="checkEmailNotif" checked>
                <label class="form-check-label small" for="checkEmailNotif">Recibir alertas por correo cuando un pedido avance de etapa</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="checkEntregaNotif" checked>
                <label class="form-check-label small" for="checkEntregaNotif">Notificar 2 días antes de la fecha de entrega estimada</label>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Móvil -->
    <nav class="mobile-bottom-nav">
        <a href="inicio.html"><i class="bi bi-house"></i>Inicio</a>
        <a href="pedidos.html"><i class="bi bi-bag"></i>Pedidos</a>
        <a href="seguimiento.html"><i class="bi bi-diagram-3"></i>Seguimiento</a>
        <a href="qr.html"><i class="bi bi-qr-code"></i>QR</a>
        <a href="perfil.html" class="active"><i class="bi bi-person"></i>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
