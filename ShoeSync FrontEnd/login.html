<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeSync - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Independientes -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-shoesync-secondary d-flex align-items-center justify-content-center min-vh-100 p-3">

    <main class="card-shoesync w-100 p-4 p-sm-5" style="max-width: 420px;">
        <header class="text-center mb-4">
            <div class="text-center mb-3">
    <img src="assets/img/logo/logo.png" alt="ShoeSync Logo" style="max-height: 90px; width: auto;">
</div>
            <p class="text-secondary small">Gestión para la Industria del Calzado</p>
        </header>

        <!-- Alerta de Error -->
        <div id="loginAlert" class="alert alert-danger d-none py-2 fs-6" role="alert"></div>

        <form id="formLogin" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="email" class="form-label text-secondary small fw-bold">Correo Electrónico</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" placeholder="usuario@shoesync.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label text-secondary small fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0" id="password" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" onclick="togglePasswordVisibility()"><i class="bi bi-eye" id="toggleIcon"></i></button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label small text-secondary" for="remember">Recordarme</label>
                </div>
                <a href="#" onclick="alert('Opción de recuperación en construcción.')" class="small text-primary text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-shoesync-primary w-100 mb-3">Iniciar Sesión</button>
        </form>

        <section class="border-top pt-3 text-center">
            <p class="text-secondary extra-small mb-2 fw-semibold">Cuentas de demostración rápida:</p>
            <div class="d-flex flex-wrap gap-1 justify-content-center">
                <button onclick="fillDemo('admin@shoesync.com')" class="btn btn-sm btn-shoesync-secondary">Admin</button>
                <button onclick="fillDemo('ventas@shoesync.com')" class="btn btn-sm btn-shoesync-secondary">Ventas</button>
                <button onclick="fillDemo('produccion@shoesync.com')" class="btn btn-sm btn-shoesync-secondary">Producción</button>
                <button onclick="fillDemo('almacen@shoesync.com')" class="btn btn-sm btn-shoesync-secondary">Almacén</button>
                <button onclick="fillDemo('cliente@shoesync.com')" class="btn btn-sm btn-shoesync-secondary">Cliente</button>
            </div>
        </section>
    </main>

    <!-- Scripts Independientes -->
    <script src="assets/js/auth.js"></script>
    <script>
        function fillDemo(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = '123456';
        }

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const em = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            const res = loginUser(em, pw);
            if (!res.success) {
                const al = document.getElementById('loginAlert');
                al.textContent = res.message;
                al.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
